<title>zhiying dashboard</title>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0b12;
    color: #e8e8ff;
    display: flex;
    height: 100vh;
  }
  aside {
    width: 320px;
    border-right: 1px solid #232336;
    padding: 20px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  main {
    flex: 1;
    padding: 32px;
    overflow-y: auto;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h2 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: #8888a8; font-size: 13px; }
  .project-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    font-size: 14px;
  }
  .project-item:hover { background: #16162a; }
  .project-item.active { background: #241f3d; }
  .project-item .bar {
    height: 4px;
    border-radius: 2px;
    background: #232336;
    margin-top: 6px;
    overflow: hidden;
  }
  .project-item .bar > div { height: 100%; background: #a78bfa; }
  form { margin-top: 24px; border-top: 1px solid #232336; padding-top: 16px; }
  label { display: block; font-size: 12px; color: #8888a8; margin: 10px 0 4px; }
  input, textarea {
    width: 100%;
    background: #16162a;
    border: 1px solid #232336;
    border-radius: 6px;
    color: #e8e8ff;
    padding: 8px;
    font-size: 13px;
    font-family: inherit;
  }
  button {
    background: #a78bfa;
    color: #0b0b12;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  button:hover { background: #c4b5fd; }
  button:disabled { background: #333350; color: #8888a8; cursor: not-allowed; }
  button.secondary { background: #232336; color: #e8e8ff; }
  button.secondary:hover { background: #2e2e48; }
  .stage-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #1a1a2c;
  }
  .stage-icon {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .stage-icon.completed { background: #4ade80; color: #0b0b12; }
  .stage-icon.pending { background: #232336; color: #8888a8; }
  .stage-body { flex: 1; }
  .stage-name { font-size: 14px; font-weight: 600; text-transform: capitalize; }
  .stage-hint { font-size: 12px; color: #8888a8; margin-top: 2px; }
  video { width: 100%; max-width: 640px; border-radius: 10px; margin-top: 16px; display: block; }
  pre {
    background: #16162a; border-radius: 8px; padding: 12px;
    font-size: 11px; overflow-x: auto; max-height: 200px; color: #a78bfa;
  }
  details summary { cursor: pointer; font-size: 12px; color: #8888a8; margin-top: 6px; }
  .error { color: #f87171; font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
  .empty { color: #8888a8; font-size: 14px; margin-top: 60px; text-align: center; }
</style>

<aside>
  <h1>zhiying</h1>
  <div class="muted">cinematic-trailer pipeline</div>
  <div id="project-list"></div>

  <form id="new-project-form">
    <div class="muted" style="font-size:13px; font-weight:600; color:#e8e8ff;">New project</div>
    <label>Topic</label>
    <input name="topic" required placeholder="Product launch teaser">
    <label>Tone (optional)</label>
    <input name="tone" placeholder="confident, cinematic">
    <label>Duration (seconds)</label>
    <input name="duration_seconds" type="number" step="0.5" min="1" value="12" required>
    <label>Signature moment</label>
    <textarea name="signature_moment" rows="3" required placeholder="The one moment the viewer should feel something at."></textarea>
    <button type="submit">Create + write brief</button>
    <div id="new-project-error" class="error"></div>
  </form>
</aside>

<main id="main">
  <div class="empty">Select a project, or create a new one.</div>
</main>

<script>
const state = { projects: [], selected: null };

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

async function refreshProjects() {
  state.projects = await api("/api/projects");
  renderProjectList();
}

function renderProjectList() {
  const el = document.getElementById("project-list");
  el.innerHTML = "";
  for (const p of state.projects) {
    const div = document.createElement("div");
    div.className = "project-item" + (p.project_id === state.selected ? " active" : "");
    const pct = Math.round((p.completed_stages.length / p.total_stages) * 100);
    div.innerHTML = `<div>${p.project_id}</div>
      <div class="muted">${p.completed_stages.length}/${p.total_stages} stages${p.delivered ? " · delivered" : ""}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>`;
    div.onclick = () => selectProject(p.project_id);
    el.appendChild(div);
  }
}

async function selectProject(id) {
  state.selected = id;
  renderProjectList();
  await renderMain();
}

const STAGE_HINTS = {
  brief: "Written from the form on the left.",
  scene_plan: "Not triggerable here -- author this via Claude Code (skills/pipelines/cinematic-trailer/scene-plan-director.md), then refresh.",
  assets: "Generates placeholder music via the local ffmpeg-synth tool.",
  compose: "Renders through Remotion, muxes in the assets audio.",
  deliver: "Copies the render to the configured output directory.",
};
const TRIGGERABLE = new Set(["assets", "compose", "deliver"]);

async function renderMain() {
  const main = document.getElementById("main");
  main.innerHTML = "<div class='muted'>Loading…</div>";
  const detail = await api(`/api/projects/${state.selected}`);

  const completedNames = new Set(detail.stages.filter(s => s.checkpoint?.status === "completed").map(s => s.stage));

  let rows = "";
  detail.stages.forEach((s, i) => {
    const done = s.checkpoint?.status === "completed";
    const prereqOk = i === 0 || completedNames.has(detail.stages[i - 1].stage);
    const canTrigger = TRIGGERABLE.has(s.stage) && !done && prereqOk;
    rows += `<div class="stage-row">
      <div class="stage-icon ${done ? "completed" : "pending"}">${done ? "✓" : i + 1}</div>
      <div class="stage-body">
        <div class="stage-name">${s.stage.replace("_", " ")}</div>
        <div class="stage-hint">${STAGE_HINTS[s.stage] || ""}</div>
        ${s.checkpoint ? `<details><summary>checkpoint</summary><pre>${JSON.stringify(s.checkpoint.artifact, null, 2)}</pre></details>` : ""}
      </div>
      ${canTrigger ? `<button data-stage="${s.stage}" class="run-stage">Run ${s.stage}</button>` : ""}
    </div>`;
  });

  const composeCkpt = detail.stages.find(s => s.stage === "compose")?.checkpoint;
  const videoSrc = composeCkpt ? `/media/pipelines/${detail.project_id}/render.mp4?t=${Date.now()}` : null;

  main.innerHTML = `
    <h2>${detail.project_id}</h2>
    <div class="muted">${detail.pipeline}</div>
    ${rows}
    ${videoSrc ? `<video controls src="${videoSrc}"></video>` : ""}
    <div id="stage-error" class="error"></div>
  `;

  main.querySelectorAll(".run-stage").forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Running…";
      const errorEl = document.getElementById("stage-error");
      errorEl.textContent = "";
      try {
        await api(`/api/projects/${state.selected}/${btn.dataset.stage}`, { method: "POST" });
        await refreshProjects();
        await renderMain();
      } catch (e) {
        errorEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = `Run ${btn.dataset.stage}`;
      }
    };
  });
}

document.getElementById("new-project-form").onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  data.duration_seconds = parseFloat(data.duration_seconds);
  if (!data.tone) delete data.tone;
  const errorEl = document.getElementById("new-project-error");
  errorEl.textContent = "";
  try {
    const { project_id } = await api("/api/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    form.reset();
    form.duration_seconds.value = "12";
    await refreshProjects();
    await selectProject(project_id);
  } catch (e) {
    errorEl.textContent = e.message;
  }
};

refreshProjects();
</script>
