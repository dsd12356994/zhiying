<title>zhiying dashboard</title>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(167,139,250,0.14), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(125,211,252,0.08), transparent 55%),
      #07070d;
    color: #e8e8ff;
    min-height: 100vh;
  }
  .muted { color: #8a8aa8; font-size: 13px; }

  /* ---------- hero ---------- */
  .hero {
    padding: 56px 40px 32px;
    text-align: center;
  }
  .hero-title {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0;
    background: linear-gradient(90deg, #e8e8ff 10%, #a78bfa 55%, #7dd3fc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero-sub { margin-top: 8px; font-size: 14px; color: #9d9dc0; }

  /* ---------- showcase ---------- */
  .showcase { padding: 8px 40px 40px; max-width: 1280px; margin: 0 auto; }
  .showcase-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .showcase-heading h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.2px; color: #c4b5fd; margin: 0; font-weight: 700; }
  .showcase-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }
  .effect-card {
    background: #0e0e18;
    border: 1px solid #232336;
    border-radius: 14px;
    overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .effect-card:hover {
    transform: translateY(-3px);
    border-color: #4c3d8f;
    box-shadow: 0 12px 32px -12px rgba(124, 58, 237, 0.45);
  }
  .effect-card video { width: 100%; aspect-ratio: 16/9; display: block; background: #000; object-fit: cover; }
  .effect-card-body { padding: 14px 16px 16px; }
  .effect-card-name { font-size: 14px; font-weight: 700; }
  .effect-card-desc { font-size: 12px; color: #8a8aa8; margin-top: 4px; line-height: 1.5; }
  .effect-card-tag {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .4px;
    text-transform: uppercase; color: #a78bfa; background: rgba(167,139,250,0.12);
    border-radius: 5px; padding: 2px 6px; margin-top: 8px;
  }

  /* ---------- workspace ---------- */
  .workspace { display: flex; border-top: 1px solid #1a1a2c; }
  aside {
    width: 320px;
    border-right: 1px solid #1a1a2c;
    padding: 24px;
    overflow-y: auto;
    flex-shrink: 0;
    max-height: calc(100vh - 260px);
  }
  main { flex: 1; padding: 32px 40px; overflow-y: auto; max-height: calc(100vh - 260px); }
  aside h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #c4b5fd; margin: 0 0 14px; font-weight: 700; }
  main h2 { font-size: 22px; margin: 0 0 4px; }

  .project-item {
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 6px;
    font-size: 14px;
    border: 1px solid transparent;
    transition: background .15s ease, border-color .15s ease;
  }
  .project-item:hover { background: #14142280; }
  .project-item.active { background: #1c1733; border-color: #3d3268; }
  .project-item .bar {
    height: 4px; border-radius: 2px; background: #1e1e30; margin-top: 8px; overflow: hidden;
  }
  .project-item .bar > div { height: 100%; background: linear-gradient(90deg, #a78bfa, #7dd3fc); }

  form { margin-top: 26px; border-top: 1px solid #1a1a2c; padding-top: 18px; }
  form > .form-title { font-size: 13px; font-weight: 700; color: #e8e8ff; }
  label { display: block; font-size: 11px; color: #8a8aa8; margin: 12px 0 5px; text-transform: uppercase; letter-spacing: .4px; }
  input, textarea {
    width: 100%;
    background: #14141f;
    border: 1px solid #262640;
    border-radius: 8px;
    color: #e8e8ff;
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #a78bfa; }
  button {
    background: linear-gradient(135deg, #a78bfa, #8b6ff0);
    color: #0b0b12;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
    transition: filter .15s ease, transform .1s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.98); }
  button:disabled { background: #26263c; color: #6f6f90; cursor: not-allowed; filter: none; }

  .stage-row { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid #16162280; }
  .stage-icon {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0; font-weight: 700;
  }
  .stage-icon.completed { background: #4ade80; color: #05130a; }
  .stage-icon.pending { background: #1e1e30; color: #6f6f90; }
  .stage-body { flex: 1; }
  .stage-name { font-size: 14px; font-weight: 700; text-transform: capitalize; }
  .stage-hint { font-size: 12px; color: #8a8aa8; margin-top: 2px; }
  main video.render-preview { width: 100%; max-width: 640px; border-radius: 12px; margin-top: 18px; display: block; box-shadow: 0 16px 40px -16px rgba(0,0,0,0.6); }
  pre { background: #14141f; border-radius: 8px; padding: 12px; font-size: 11px; overflow-x: auto; max-height: 200px; color: #b9a4fc; border: 1px solid #232336; }
  details summary { cursor: pointer; font-size: 12px; color: #8a8aa8; margin-top: 8px; }
  .error { color: #f87171; font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
  .empty { color: #6f6f90; font-size: 14px; margin-top: 60px; text-align: center; }
</style>

<header class="hero">
  <div class="hero-title">zhiying</div>
  <div class="hero-sub">Agent-driven cinematic pipeline, built on Remotion</div>
</header>

<section class="showcase">
  <div class="showcase-heading">
    <h2>Effects Layer</h2>
    <div class="muted">composer/src/effects/ — what a scene_plan cut actually renders</div>
  </div>
  <div class="showcase-grid" id="effects-grid"></div>
</section>

<div class="workspace">
  <aside>
    <h1>Projects</h1>
    <div id="project-list"></div>

    <form id="new-project-form">
      <div class="form-title">New project</div>
      <label>Topic</label>
      <input name="topic" required placeholder="Product launch teaser">
      <label>Tone (optional)</label>
      <input name="tone" placeholder="confident, cinematic">
      <label>Duration (seconds)</label>
      <input name="duration_seconds" type="number" step="0.5" min="1" value="12" required>
      <label>Signature moment</label>
      <textarea name="signature_moment" rows="3" required placeholder="The one moment the viewer should feel something at."></textarea>
      <button type="submit">Create + write brief</button>
      <div id="new-project-error" class="error"></div>
    </form>
  </aside>

  <main id="main">
    <div class="empty">Select a project, or create a new one.</div>
  </main>
</div>

<script>
const EFFECTS = [
  {
    name: "3D Text Intro",
    tag: "@remotion/three",
    src: "/media/showcase/three-text-intro.mp4",
    desc: "Extruded 3D typography with bevel + specular lighting, camera dolly and a light sweep -- both plain functions of frame.",
  },
  {
    name: "Particle Burst",
    tag: "custom GPU shader",
    src: "/media/showcase/particle-burst.mp4",
    desc: "2,200 points, seeded-deterministic direction/speed, driven by a single uProgress uniform. No useFrame, no accumulated state.",
  },
  {
    name: "Shader Transition",
    tag: "GLSL fragment shader",
    src: "/media/showcase/shader-transition.mp4",
    desc: "Fullscreen quad, noise-perturbed radial wipe -- the gl-transitions-style effect, authored directly against @remotion/three.",
  },
  {
    name: "Lottie",
    tag: "@remotion/lottie",
    src: "/media/showcase/lottie-pulse.mp4",
    desc: "Vector motion graphics via lottie-web, frame-synced automatically by the official Remotion wrapper.",
  },
];

function renderEffectsGrid() {
  const grid = document.getElementById("effects-grid");
  grid.innerHTML = EFFECTS.map(fx => `
    <div class="effect-card">
      <video src="${fx.src}" autoplay loop muted playsinline></video>
      <div class="effect-card-body">
        <div class="effect-card-name">${fx.name}</div>
        <div class="effect-card-desc">${fx.desc}</div>
        <span class="effect-card-tag">${fx.tag}</span>
      </div>
    </div>
  `).join("");
}
renderEffectsGrid();

const state = { projects: [], selected: null };

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

async function refreshProjects() {
  state.projects = await api("/api/projects");
  renderProjectList();
}

function renderProjectList() {
  const el = document.getElementById("project-list");
  el.innerHTML = "";
  for (const p of state.projects) {
    const div = document.createElement("div");
    div.className = "project-item" + (p.project_id === state.selected ? " active" : "");
    const pct = Math.round((p.completed_stages.length / p.total_stages) * 100);
    div.innerHTML = `<div>${p.project_id}</div>
      <div class="muted">${p.completed_stages.length}/${p.total_stages} stages${p.delivered ? " · delivered" : ""}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>`;
    div.onclick = () => selectProject(p.project_id);
    el.appendChild(div);
  }
}

async function selectProject(id) {
  state.selected = id;
  renderProjectList();
  await renderMain();
}

const STAGE_HINTS = {
  brief: "Written from the form on the left.",
  scene_plan: "Not triggerable here -- author this via Claude Code (skills/pipelines/cinematic-trailer/scene-plan-director.md), then refresh.",
  assets: "Generates placeholder music via the local ffmpeg-synth tool.",
  compose: "Renders through Remotion, muxes in the assets audio.",
  deliver: "Copies the render to the configured output directory.",
};
const TRIGGERABLE = new Set(["assets", "compose", "deliver"]);

async function renderMain() {
  const main = document.getElementById("main");
  main.innerHTML = "<div class='muted'>Loading…</div>";
  const detail = await api(`/api/projects/${state.selected}`);

  const completedNames = new Set(detail.stages.filter(s => s.checkpoint?.status === "completed").map(s => s.stage));

  let rows = "";
  detail.stages.forEach((s, i) => {
    const done = s.checkpoint?.status === "completed";
    const prereqOk = i === 0 || completedNames.has(detail.stages[i - 1].stage);
    const canTrigger = TRIGGERABLE.has(s.stage) && !done && prereqOk;
    rows += `<div class="stage-row">
      <div class="stage-icon ${done ? "completed" : "pending"}">${done ? "✓" : i + 1}</div>
      <div class="stage-body">
        <div class="stage-name">${s.stage.replace("_", " ")}</div>
        <div class="stage-hint">${STAGE_HINTS[s.stage] || ""}</div>
        ${s.checkpoint ? `<details><summary>checkpoint</summary><pre>${JSON.stringify(s.checkpoint.artifact, null, 2)}</pre></details>` : ""}
      </div>
      ${canTrigger ? `<button data-stage="${s.stage}" class="run-stage">Run ${s.stage}</button>` : ""}
    </div>`;
  });

  const composeCkpt = detail.stages.find(s => s.stage === "compose")?.checkpoint;
  const videoSrc = composeCkpt ? `/media/pipelines/${detail.project_id}/render.mp4?t=${Date.now()}` : null;

  main.innerHTML = `
    <h2>${detail.project_id}</h2>
    <div class="muted">${detail.pipeline}</div>
    ${rows}
    ${videoSrc ? `<video class="render-preview" controls src="${videoSrc}"></video>` : ""}
    <div id="stage-error" class="error"></div>
  `;

  main.querySelectorAll(".run-stage").forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Running…";
      const errorEl = document.getElementById("stage-error");
      errorEl.textContent = "";
      try {
        await api(`/api/projects/${state.selected}/${btn.dataset.stage}`, { method: "POST" });
        await refreshProjects();
        await renderMain();
      } catch (e) {
        errorEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = `Run ${btn.dataset.stage}`;
      }
    };
  });
}

document.getElementById("new-project-form").onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  data.duration_seconds = parseFloat(data.duration_seconds);
  if (!data.tone) delete data.tone;
  const errorEl = document.getElementById("new-project-error");
  errorEl.textContent = "";
  try {
    const { project_id } = await api("/api/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    form.reset();
    form.duration_seconds.value = "12";
    await refreshProjects();
    await selectProject(project_id);
  } catch (e) {
    errorEl.textContent = e.message;
  }
};

refreshProjects();
</script>
