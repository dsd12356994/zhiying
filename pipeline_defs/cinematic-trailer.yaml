name: cinematic-trailer
description: >
  15-30s cinematic/trailer-style video: 3D text intro, GPU particle bursts,
  shader-based scene transitions, camera movement. The flagship style for
  this repo -- proves out the composer effects layer end to end.

orchestration:
  mode: agent-driven
  budget_default_usd: 2.0

required_skills:
  - core/three-particles
  - core/vector-motion

stages:
  - name: brief
    skill: pipelines/cinematic-trailer/executive-producer
    produces: brief
    checkpoint_required: true
    human_approval_default: true
    review_focus: "Is the signature moment concrete and specific to this brief, not a generic placeholder?"

  - name: scene_plan
    skill: pipelines/cinematic-trailer/scene-plan-director
    required_artifacts_in: [brief]
    produces: scene_plan
    checkpoint_required: true
    human_approval_default: false
    review_focus: "Does every cut earn its place? No two consecutive cuts use the same effect type."
    success_criteria:
      - "cuts sum to the brief's duration_seconds within one second"
      - "at least one cut is three_text_intro, particle_burst, or shader_transition -- not text_card-only"

  - name: assets
    skill: pipelines/cinematic-trailer/assets-director
    required_artifacts_in: [scene_plan]
    produces: assets_manifest
    optional_tools: [macos_say_tts, placeholder_music, pexels_stock_footage]
    checkpoint_required: true
    human_approval_default: false

  - name: compose
    skill: pipelines/cinematic-trailer/compose-director
    required_artifacts_in: [scene_plan, assets_manifest]
    produces: render
    checkpoint_required: true
    human_approval_default: false
    review_focus: "Render succeeded, output duration matches scene_plan, no WebGL/console errors in the render log."

  - name: deliver
    skill: pipelines/cinematic-trailer/deliver-director
    required_artifacts_in: [render]
    produces: final_delivery
    checkpoint_required: true
    human_approval_default: true
